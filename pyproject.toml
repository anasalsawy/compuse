[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tasker"
version = "0.4.3"
description = "Tasker interactive NeuralAgent-style desktop computer-use runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pydantic>=2.7,<3",
    "prompt-toolkit>=3.0,<4",
]

[project.scripts]
tasker = "compuse.app.tasker_cli:main"
tasker-agent = "compuse.app.agent_cli:main"
tasker-demo = "compuse.app.dual_loop_demo:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
desktop = [
    "pyautogui>=0.9.54",
    "Pillow>=10",
    "pyperclip>=1.8",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["compuse"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
