name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            # The CPython 3.11 coverage tracer intermittently aborts during
            # the repository's SQLite thread stress test. Keep full tests on
            # 3.11 and enforce the coverage gate on 3.12 and 3.13.
            xvfb-run -a pytest
          else
            xvfb-run -a pytest --cov=compuse --cov-report=term-missing --cov-fail-under=80
          fi
